name: CI - Chatbot

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate-pr:
    # SHA do DevOps que permite promover develop para main.
    uses: app-volta/volta-devops/.github/workflows/reusable-validate-pr.yaml@61413ee2cf023b74653753c090859a67b3e04b45
    secrets: inherit

  validate-test:
    name: validate-test
    runs-on: ubuntu-latest
    needs: validate-pr
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar importação da aplicação
        run: python -c "from app.main import app"

      - name: Executar testes
        run: python -m pytest -q --junitxml=relatorio-pytest.xml

      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-validate-test
          path: relatorio-pytest.xml
          retention-days: 5
