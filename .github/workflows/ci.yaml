name: CI - Chatbot

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate-pr:
    uses: app-volta/volta-devops/.github/workflows/reusable-validate-pr.yaml@v1
    secrets: inherit

  build:
    name: build
    runs-on: ubuntu-latest
    needs: validate-pr
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar importação da aplicação
        run: python -c "from app.main import app"

      - name: Executar testes
        run: pytest -q
