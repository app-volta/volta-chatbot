name: Build chatbot image

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-on-push:
    if: github.event_name == 'push'
    uses: app-volta/volta-devops/.github/workflows/reusable-docker-build-push.yaml@v1
    with:
      image-name: chatbot
      environment: ${{ github.ref_name == 'main' && 'prod' || 'qa' }}
      context: .
      dockerfile: ./Dockerfile
      push: true
      notify-devops: true
    secrets:
      devops-dispatch-token: ${{ secrets.DEVOPS_DISPATCH_TOKEN }}

  build-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: app-volta/volta-devops/.github/workflows/reusable-docker-build-push.yaml@v1
    with:
      image-name: chatbot
      environment: qa
      context: .
      dockerfile: ./Dockerfile
      push: true
      notify-devops: true
    secrets:
      devops-dispatch-token: ${{ secrets.DEVOPS_DISPATCH_TOKEN }}
